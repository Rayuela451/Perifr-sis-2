<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Una vida, cinco momentos · ELE A2</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--yellow:#FADB63;--coral:#BA4F30;--green:#6A854F;--teal:#158F91;--ink:#1D1811;--paper:#FFF7DF}*{box-sizing:border-box}body{margin:0;background:var(--yellow);font-family:Nunito,'Trebuchet MS',sans-serif;color:var(--ink)}.scene{max-width:1450px;min-height:100vh;margin:auto;padding:42px 50px 30px;background:radial-gradient(circle at 94% 8%,#f9b45d 0 8%,transparent 8.1%),var(--yellow);overflow:hidden;position:relative}.scene:before{content:'';position:absolute;width:300px;height:300px;border:30px solid #e68b4270;border-radius:50%;left:-180px;bottom:-175px;pointer-events:none}.kicker{font-size:13px;letter-spacing:.17em;color:var(--coral);font-weight:900;text-transform:uppercase}h1{font-size:clamp(34px,4.7vw,65px);letter-spacing:-.04em;line-height:1.05;margin:10px 0 11px;font-weight:900}.sub{font-size:16px;margin:0 0 27px}.timeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-bottom:27px;position:relative}.timeline:before{content:'';position:absolute;left:7%;right:7%;height:5px;background:#1D18113a;top:23px}.stage{font:inherit;position:relative;border:3px solid var(--ink);border-radius:19px;min-height:110px;background:var(--paper);color:var(--ink);box-shadow:5px 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 5px;cursor:pointer;transition:transform .2s,background .2s}.stage:hover{transform:translateY(-4px)}.stage[aria-selected=true]{background:var(--teal);color:#fff;transform:translateY(-3px)}.stage:focus-visible,.nav button:focus-visible{outline:4px dashed var(--coral);outline-offset:5px}.emoji{font-size:29px}.stage-name{font-size:clamp(13px,1.5vw,18px);font-weight:900;text-align:center}.panel{border:4px solid var(--ink);background:var(--teal);color:#fff;border-radius:23px;box-shadow:10px 11px 0 var(--coral);padding:24px 28px 28px}.panel.animate{animation:in .38s ease both}@keyframes in{from{opacity:.35;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.number{font-size:14px;font-weight:900;color:var(--yellow);letter-spacing:.14em}.panel-title{font-size:clamp(27px,3vw,38px);font-weight:900;margin:4px 0}.bigemoji{font-size:53px}.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.word{background:var(--paper);border:3px solid var(--ink);border-radius:17px;min-height:98px;box-shadow:4px 5px 0 #1D1811aa;color:var(--ink);font-size:clamp(16px,1.6vw,22px);font-weight:900;line-height:1.22;text-align:center;padding:16px;display:flex;align-items:center;justify-content:center;animation:pop .35s ease both}.word:nth-child(2){animation-delay:.035s}.word:nth-child(3){animation-delay:.07s}.word:nth-child(4){animation-delay:.105s}.word:nth-child(5){animation-delay:.14s}.word:nth-child(6){animation-delay:.175s}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}.examples{margin-top:23px;border-top:2px dashed #ffffff8a;padding-top:14px}.examples p{font-size:clamp(15px,1.55vw,19px);font-weight:700;line-height:1.45;margin:8px 0}.examples p:before{content:'✦ ';color:var(--yellow)}.footer{display:flex;gap:18px;justify-content:space-between;align-items:center;margin-top:25px}.tip{font-size:16px}.tip b{color:var(--coral)}.nav{display:flex;gap:10px}.nav button{background:var(--coral);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 5px 0 var(--ink);font:900 16px Nunito,sans-serif;padding:12px 16px;color:#fff;cursor:pointer}.nav button:hover{background:var(--green)}.note{font-size:12px;margin-top:18px;opacity:.8}
@media(max-width:850px){.scene{padding:28px 23px}.timeline{grid-template-columns:repeat(3,1fr)}.timeline:before{display:none}.words{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.scene{padding:22px 14px}.timeline{grid-template-columns:repeat(2,1fr);gap:11px}.stage{min-height:90px}.panel{padding:17px}.words{gap:9px}.word{font-size:15px;min-height:86px;padding:9px}.footer{align-items:flex-start;flex-direction:column}.nav{align-self:flex-end}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Formato compacto para iframe horizontal de Genially */
html,body{height:100%;}body{overflow:auto}
.scene{max-width:none;min-height:100vh;padding:14px 24px 12px}
.kicker{font-size:10px;letter-spacing:.12em}
h1{font-size:clamp(25px,3.5vw,38px);margin:3px 0 5px;line-height:1}
.sub{font-size:12px;line-height:1.2;margin:0 0 12px}
.timeline{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:13px}
.timeline:before{top:15px}
.stage{min-height:63px;border-width:2px;border-radius:13px;box-shadow:3px 4px 0 var(--ink);gap:1px;padding:5px 3px}
.emoji{font-size:20px}.stage-name{font-size:13px;line-height:1.1}
.panel{padding:12px 16px 13px;border-width:3px;border-radius:16px;box-shadow:6px 7px 0 var(--coral)}
.panel-head{margin-bottom:8px}.number{font-size:10px;letter-spacing:.1em}.panel-title{font-size:24px;margin:1px 0;line-height:1.1}.bigemoji{font-size:30px}
.words{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.word{min-height:43px;border-width:2px;border-radius:10px;box-shadow:2px 3px 0 #1D1811aa;font-size:13px;line-height:1.15;padding:6px 8px}
.examples{margin-top:10px;padding-top:7px}.examples p{font-size:12px;line-height:1.3;margin:3px 0;font-weight:700}
.footer{margin-top:11px}.nav{gap:8px}.nav button{font-size:12px;padding:7px 11px;border-width:2px;border-radius:10px;box-shadow:2px 3px 0 var(--ink)}
.note{font-size:10px;margin-top:8px;opacity:.9}
@media (max-width:700px){.scene{padding:12px 14px}.timeline{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.stage{min-height:65px}.stage-name{font-size:10px}.emoji{font-size:18px}.words{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.word{font-size:11px;padding:5px 4px;min-height:45px}.examples p{font-size:11px}.panel{padding:10px}.panel-title{font-size:20px}}
@media (max-width:420px){.timeline{grid-template-columns:repeat(3,minmax(0,1fr))}.words{grid-template-columns:repeat(2,minmax(0,1fr))}.scene{min-height:100vh}}
</style></head><body><main class="scene"><div class="kicker">Español A2 · Biografías</div><h1>UNA VIDA, <span style="color:var(--coral)">CINCO MOMENTOS</span></h1><p class="sub">Descubre vocabulario para contar una biografía. Pulsa un momento para ver las expresiones y ejemplos.</p><div class="timeline" role="tablist" aria-label="Momentos de la vida" id="timeline"></div><section class="panel" id="panel" role="tabpanel" aria-live="polite"><div class="panel-head"><div><div class="number" id="number"></div><h2 class="panel-title" id="panelTitle"></h2></div><div class="bigemoji" id="bigemoji" aria-hidden="true"></div></div><div class="words" id="words"></div><div class="examples" id="examples"></div></section><div class="footer"><div class="nav"><button id="prev" aria-label="Anterior">←</button><button id="next">Siguiente →</button></div></div><p class="note">Las etapas son orientativas: muchos acontecimientos pueden ocurrir a cualquier edad.</p></main><script>
const data=[
{title:'Infancia',emoji:'🌱',color:'#158F91',words:['Nacer','Crecer','Ir al colegio','Mudarse a otra ciudad','Empezar la escuela','Aprender a leer'],examples:['Nació en Valparaíso en 1998.','Creció con su familia en una ciudad pequeña.','A los siete años se mudó a otra ciudad y empezó la escuela allí.']},
{title:'Adolescencia',emoji:'🎒',color:'#6A854F',words:['Empezar la secundaria','Enamorarse','Hacer amigos','Cambiar de colegio','Mudarse a otra ciudad','Hacer un intercambio'],examples:['Empezó la secundaria a los doce años.','Cambió de colegio y conoció a nuevos amigos.','A los dieciséis años hizo un intercambio en otro país.']},
{title:'Juventud',emoji:'🌻',color:'#BA4F30',words:['Empezar la universidad','Terminar los estudios','Empezar a trabajar','Vivir solo/a','Viajar a otra ciudad','Hacer un intercambio'],examples:['Empezó la universidad en 2018.','Después de terminar los estudios, empezó a trabajar.','Se fue a vivir sola y viajó a otra ciudad.']},
{title:'Vida adulta',emoji:'🪁',color:'#158F91',words:['Cambiar de trabajo','Mudarse a otra ciudad o país','Casarse','Tener hijos','Divorciarse','Crear un proyecto'],examples:['Cambió de trabajo y se mudó a otro país.','Más tarde creó un proyecto con sus amigos.','Se casó, tuvo dos hijos y años después se divorció.']},
{title:'Vejez',emoji:'🌳',color:'#6A854F',words:['Jubilarse','Tener nietos','Dedicar tiempo a sus aficiones','Viajar','Compartir historias','Morir'],examples:['Se jubiló después de muchos años de trabajo.','En sus últimos años disfrutó de sus aficiones y compartió historias con su familia.','Murió a los noventa años.']}
];
const timeline=document.getElementById('timeline'),panel=document.getElementById('panel'),words=document.getElementById('words'),examples=document.getElementById('examples');let current=0;
data.forEach((item,i)=>{const b=document.createElement('button');b.className='stage';b.type='button';b.setAttribute('role','tab');b.id='tab'+i;b.setAttribute('aria-controls','panel');b.innerHTML='<span class="emoji" aria-hidden="true">'+item.emoji+'</span><span class="stage-name">'+item.title+'</span>';b.addEventListener('click',()=>show(i));b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(i+1,true)}if(e.key==='ArrowLeft'){e.preventDefault();show(i-1,true)}});timeline.append(b)});
function show(i,focus=false){current=(i+data.length)%data.length;const d=data[current];[...timeline.children].forEach((t,j)=>{t.setAttribute('aria-selected',String(j===current));t.tabIndex=j===current?0:-1});document.getElementById('number').textContent=String(current+1).padStart(2,'0')+' · MOMENTO DE LA VIDA';document.getElementById('panelTitle').textContent=d.title;document.getElementById('bigemoji').textContent=d.emoji;panel.style.background=d.color;panel.setAttribute('aria-labelledby','tab'+current);words.replaceChildren();examples.replaceChildren();d.words.forEach(w=>{let card=document.createElement('div');card.className='word';card.textContent=w;words.append(card)});d.examples.forEach(s=>{let p=document.createElement('p');p.textContent=s;examples.append(p)});panel.classList.remove('animate');void panel.offsetWidth;panel.classList.add('animate');if(focus)timeline.children[current].focus()}
document.getElementById('prev').addEventListener('click',()=>show(current-1));document.getElementById('next').addEventListener('click',()=>show(current+1));show(0);
</script></body></html>
